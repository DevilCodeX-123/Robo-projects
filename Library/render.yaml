services:
  - type: web
    name: robo-stock-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENABLE_DEMO_AUTH
        value: "true"
      - key: NODE_ENV
        value: "production"

