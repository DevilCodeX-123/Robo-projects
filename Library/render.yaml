services:
  - type: web
    name: robo-stock
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENABLE_DEMO_AUTH
        value: "true"
      - key: NODE_ENV
        value: "production"

